substitutions:
  device_name: remeha-thermostat
  friendly_name: "Remeha Thermostat"
  ble_mac: "00:00:00:00:00:00"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    remeha_confida: DEBUG
    esp32_ble_tracker: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

external_components:
  # Load the Confida component
  - source: github://robertklep/esphome-remeha-confida@main
    components: [ remeha_confida ]
  # Load the thermostat component
  - source: github://robertklep/esphome-remeha-thermostat@main
    components: [ remeha_thermostat ]

switch:
  - platform: template
    name: "Remeha Comms Active"
    icon: mdi:bluetooth
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(confida).set_active(true);'
    turn_off_action:
      - lambda: 'id(confida).set_active(false);'

esp32_ble:
  io_capability: none

esp32_ble_tracker:

ble_client:
  - mac_address: ${ble_mac}
    id: confida_client

## Remeha Confida configuration
remeha_confida:
  id: confida
  ble_client_id: confida_client
  update_interval: 30s
  service_uuid: "f8fc98e4-5919-4a5c-852e-dfe04ad383c0"
  write_uuid:   "496b1b03-cebc-4d59-9c32-14ea88c266f9"
  notify_uuid:  "ab9af948-fb86-492d-820d-bdea2dcb7ecf"
  requires_pairing: false
  device_name_prefix: "GTW-IOT"
  write_result:
    name: "Remeha last write response"
  reconnect_reason:
    name: "Remeha last reconnect reason"
  reconnect_count:
    name: "Remeha reconnects"

# Minimal sensor setup for thermostat
sensor:
  - platform: remeha_confida
    name: "Room temperature high resolution (CM260)"
    id: current_temperature_id
    index: 0x5434
    # Your Remeha setup may require a different subindex.
    subindex: 1
    value_type: i16
    gain: 0.01
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    icon: mdi:home-thermometer
    read: single

number:
  - platform: remeha_confida
    name: "Temporary room setpoint (CP510)"
    id: target_temperature_id
    index: 0x3451
    subindex: 1
    value_type: u16
    gain: 0.1
    min_value: 5
    max_value: 30
    step: 0.5
    unit_of_measurement: "°C"
    device_class: temperature
    icon: mdi:home-thermometer
  - platform: remeha_confida
    id: active_schedule_id
    name: "Active Schedule (CP570)"
    internal: true
    index: 0x3458
    subindex: 1
    value_type: enum
    node: 1
    min_value: 1
    max_value: 3
    entity_category: config
    icon: mdi:thermostat-cog

binary_sensor:
  - platform: remeha_confida
    id: heat_demand_id
    name: "Heat demand? (AM021)"
    index: 0x5018
    subindex: 0
    icon: mdi:radiator

## Remeha Thermostat configuration

# Hub configuration (refers to the `remeha_confida` component above)
remeha_thermostat:
  remeha_client: confida

# This creates the actual thermostat
climate:
  - platform: remeha_thermostat
    name: 'Remeha Thermostat'
    # These refer to the components configured above.
    current_temperature: current_temperature_id
    target_temperature: target_temperature_id
    heat_demand: heat_demand_id

# Optional: selector for schedules
select:
  - platform: remeha_thermostat
    name: 'Active Schedule'
    datapoint: active_schedule_id
    type: schedule
    labels:
      - Tijdprogramma 1
      - Tijdprogramma 2
      - Tijdprogramma 3
