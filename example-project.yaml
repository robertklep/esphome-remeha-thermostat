substitutions:
  device_name: remeha-thermostat
  friendly_name: "Remeha Thermostat"
  ble_mac: "00:00:00:00:00:00"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    remeha_confida: DEBUG
    esp32_ble_tracker: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

external_components:
  # Load the Confida component
  - source: github://robertklep/esphome-remeha-confida@main
    components: [ remeha_confida ]
  # Load the thermostat component
  - source: github://robertklep/esphome-remeha-thermostat@main
    components: [ remeha_thermostat ]

switch:
  - platform: template
    name: "Remeha Comms Active"
    icon: mdi:bluetooth
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(confida).set_active(true);'
    turn_off_action:
      - lambda: 'id(confida).set_active(false);'

esp32_ble:
  io_capability: none

esp32_ble_tracker:

ble_client:
  - mac_address: ${ble_mac}
    id: confida_client

## Remeha Confida configuration
remeha_confida:
  id: confida
  ble_client_id: confida_client
  update_interval: 30s
  service_uuid: "f8fc98e4-5919-4a5c-852e-dfe04ad383c0"
  write_uuid:   "496b1b03-cebc-4d59-9c32-14ea88c266f9"
  notify_uuid:  "ab9af948-fb86-492d-820d-bdea2dcb7ecf"
  requires_pairing: false
  device_name_prefix: "GTW-IOT"
  write_result:
    name: "Remeha last write response"
  reconnect_reason:
    name: "Remeha last reconnect reason"
  reconnect_count:
    name: "Remeha reconnects"

# Minimal sensor setup for thermostat
sensor:
  - platform: remeha_confida
    name: "Room temperature high resolution (CM260)"
    id: current_temperature_id
    index: 0x5434
    # Your Remeha setup may require a different subindex:
    # the subindex refers to the heating zone that's configured in your
    # system, which is typically just a single zone at index 1.
    subindex: 1
    value_type: i16
    gain: 0.01
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    icon: mdi:home-thermometer
    read: single
  - platform: remeha_confida
    id: device_status
    internal: true
    name: "Device status (AM012)"
    index: 0x500f
    subindex: 0
    node: 1
    value_type: u8
    accuracy_decimals: 0
    icon: mdi:home-thermometer
  - platform: remeha_confida
    id: get_target_temperature_id
    name: "Requested current room temperature setpoint (CM190)"
    index: 0x5419
    subindex: 1
    value_type: i16
    gain: 0.1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: mdi:home-thermometer

number:
  # This (writable) number is used to read/write the current room setpoint.
  - platform: remeha_confida
    name: "Temporary room setpoint (CP510)"
    id: set_target_temperature_id
    index: 0x3451
    subindex: 1
    value_type: u16
    gain: 0.1
    min_value: 5
    max_value: 30
    step: 0.5
    unit_of_measurement: "°C"
    device_class: temperature
    icon: mdi:home-thermometer
  # Optional: this reads/writes the currently active heating schedule.
  # If you're not interested in this, remove it, and also remove the
  # `select` configuration below that refers to it.
  - platform: remeha_confida
    id: active_schedule_id
    name: "Active Schedule (CP570)"
    internal: true
    index: 0x3458
    subindex: 1
    value_type: enum
    node: 1
    min_value: 1
    max_value: 3
    entity_category: config
    icon: mdi:thermostat-cog

# This binary sensor is optional and serves to show if the system is actively
# heating. If not, the thermostat mode is set to "idle" (which is not
# necessarily correct, as the heater could also be active for DHW, but
# ESPHome doesn't support this state).
# If you're not interested in it, remove it, and also the `heating_state`
# configuration below that refers to it.
binary_sensor:
  - platform: template
    id: heating_state_id
    name: 'Is heating active?'
    internal: true
    lambda: |-
      auto state = id(device_status).state;
      if (std::isnan(state)) {
        return {};
      }
      // State 3 = Central Heating is active
      return state == 3;
    icon: mdi:radiator

## Remeha Thermostat configuration

# Hub configuration
remeha_thermostat:
  # refers to the `remeha_confida` component above
  remeha_client: confida

# This creates the actual thermostat
climate:
  - platform: remeha_thermostat
    name: 'Remeha Thermostat'

    ## Following below are the sensors/numbers that are used by the
    ## thermostat component to get the current temperature, set a
    ## target temperature, and (optionally) reflect the current heating
    ## status of the system.
    ##
    ## The values are ID's that refer to configured sensors/numbers above.

    current_temperature: current_temperature_id

    # The datapoint used to set the target temperature (0x3451) does
    # not always contain the currently set setpoint.
    # That's why we split up the target temperature configuration
    # between 2 datapoints:
    # - a sensor that reads the current setpoint,
    # - and a number that sets it.
    #
    # If 0x3451 works well for you, you can replace this configuration
    # by a single line:
    #
    # target_temperature: set_target_temperature_id

    target_temperature:
      get: get_target_temperature_id
      set: set_target_temperature_id

    # Optional
    heating_state: heating_state_id

# Optional: selector for schedules
select:
  - platform: remeha_thermostat
    name: 'Active Schedule'
    datapoint: active_schedule_id
    type: schedule
    labels:
      - Tijdprogramma 1
      - Tijdprogramma 2
      - Tijdprogramma 3
